<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Merch Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #2ecc71;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: auto;
            margin-top: 20px;
        }

        .search-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 60%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-box button {
            padding: 10px 15px;
            background-color: #2ecc71;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .product-card p {
            font-size: 14px;
        }

        .product-card button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>
<body>

<header>
    <h1>Merchandise Store</h1>
    <p>Temukan produk favoritmu!</p>
</header>

<div class="container">

    <!-- Search -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari produk...">
        <button onclick="searchProduct()">Cari</button>
    </div>

    <!-- Produk -->
    <div class="product-list" id="productList"></div>

</div>

<script>
    const productList = [
        {
            name: "Kaos Anime",
            price: 100000,
            description: "Kaos keren tema anime",
            image: "https://via.placeholder.com/200"
        },
        {
            name: "Hoodie Gaming",
            price: 250000,
            description: "Hoodie nyaman untuk gamer",
            image: "https://via.placeholder.com/200"
        },
        {
            name: "Topi Keren",
            price: 75000,
            description: "Topi stylish",
            image: "https://via.placeholder.com/200"
        }
    ];

    function displayProducts(products) {
        const container = document.getElementById("productList");
        container.innerHTML = "";

        products.forEach(product => {
            container.innerHTML += `
                <div class="product-card">
                    <img src="${product.image}">
                    <h3>${product.name}</h3>
                    <p>${product.description}</p>
                    <p><b>Rp ${product.price}</b></p>
                    <button>Tambah ke Keranjang</button>
                </div>
            `;
        });
    }

    function searchProduct() {
        const keyword = document.getElementById("searchInput").value.toLowerCase();

        if (keyword === "") {
            displayProducts(productList);
        } else {
            const results = productList.filter(product =>
                product.name.toLowerCase().includes(keyword)
            );

            displayProducts(results);
        }
    }

    // tampilkan awal
    displayProducts(productList);
</script>
<h2>Keranjang</h2>
<div id="cartList"></div>
<p><b>Total: Rp <span id="totalPrice">0</span></b></p>
<button onclick="checkout()">Checkout</button>

</body>
</html>
